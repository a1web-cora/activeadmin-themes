# .rubocop.yml

plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  CacheRootDirectory: tmp/rubocop_cache
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Naming/FileName:
  Exclude:
    - lib/activeadmin-themes.rb

RSpec/DescribedClass:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 5

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
