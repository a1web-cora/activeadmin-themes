# .github/workflows/ci.yml

name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: "4.0"
      - run: npm ci
      - run: bin/build-host
      - run: bin/ci
